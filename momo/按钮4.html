<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>折叠展开按钮</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #050505; }

        .unfold-btn {
            position: relative; width: 200px; height: 60px;
            background: transparent; border: none; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }

        /* 核心态：那条极细的发光线 */
        .unfold-btn::before {
            content: ''; position: absolute; top: 50%; left: 0;
            width: 100%; height: 2px;
            background: #00f0ff;
            box-shadow: 0 0 15px #00f0ff;
            transform: translateY(-50%);
            transition: all 0.3s cubic-bezier(0.8, 0, 0.2, 1);
            transition-delay: 0.2s; /* 移出时，先等框合拢，再变回线 */
        }

        /* 展开后的背板底色 */
        .unfold-btn::after {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 240, 255, 0.1);
            border-top: 2px solid #00f0ff;
            border-bottom: 2px solid #00f0ff;
            transform: scaleY(0); /* 初始状态在Y轴上被拍扁为0 */
            transform-origin: center;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.8, 0, 0.2, 1);
        }

        /* 隐藏的数据文字 */
        .btn-text {
            color: #00f0ff; font-family: 'Courier New', monospace; font-size: 18px; font-weight: bold; letter-spacing: 5px; text-shadow: 0 0 8px #00f0ff;
            opacity: 0; transform: translateY(10px);
            z-index: 10;
            transition: all 0.2s ease;
        }

        /* --- 悬停机械展开动画 --- */
        .unfold-btn:hover::before {
            /* 第一步：线消失 */
            height: 0; opacity: 0;
            transition-delay: 0s;
        }

        .unfold-btn:hover::after {
            /* 第二步：背板从中心向上下展开 */
            transform: scaleY(1); opacity: 1;
            transition-delay: 0.15s; /* 等线消失 */
        }

        .unfold-btn:hover .btn-text {
            /* 第三步：文字上浮显示 */
            opacity: 1; transform: translateY(0);
            transition-delay: 0.35s; /* 等背板拉开 */
        }
    </style>
</head>
<body>

    <button class="unfold-btn">
        <span class="btn-text">INITIALIZE</span>
    </button>

</body>
</html>
