<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>生物权限扫描按钮</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #000; font-family: 'Courier New', monospace; user-select: none; }

        .auth-btn {
            position: relative; width: 300px; height: 70px;
            background: transparent; border: 1px solid #444; border-radius: 4px;
            color: #888; font-size: 16px; font-weight: bold; letter-spacing: 2px;
            cursor: pointer; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            transition: 0.3s;
        }

        /* 隐藏的进度条背景 */
        .progress-fill {
            position: absolute; top: 0; left: 0; width: 0%; height: 100%;
            background: repeating-linear-gradient(45deg, #ff003c, #ff003c 10px, #b3002a 10px, #b3002a 20px);
            opacity: 0.3; transition: width 0.1s linear; z-index: 0;
        }

        /* 扫描激光线 */
        .scan-laser {
            position: absolute; top: 0; left: 0; width: 2px; height: 100%;
            background: #ff003c; box-shadow: 0 0 15px 5px rgba(255,0,60,0.6);
            opacity: 0; transition: left 0.1s linear; z-index: 1;
        }

        .btn-text { position: relative; z-index: 2; pointer-events: none; }

        /* 成功解锁的状态 */
        .auth-btn.granted {
            border-color: #00ff66; color: #00ff66; text-shadow: 0 0 10px #00ff66;
            box-shadow: inset 0 0 20px rgba(0, 255, 102, 0.2), 0 0 30px rgba(0, 255, 102, 0.4);
        }
        .auth-btn.granted .progress-fill { background: rgba(0, 255, 102, 0.2); width: 100% !important; opacity: 1; transition: 0.3s; }
        .auth-btn.granted .scan-laser { opacity: 0; }

    </style>
</head>
<body>

    <div class="auth-btn" id="authBtn">
        <div class="progress-fill" id="fill"></div>
        <div class="scan-laser" id="laser"></div>
        <span class="btn-text" id="btnText">HOLD TO AUTHENTICATE</span>
    </div>

    <script>
        const btn = document.getElementById('authBtn');
        const fill = document.getElementById('fill');
        const laser = document.getElementById('laser');
        const text = document.getElementById('btnText');

        let pressTimer;
        let progress = 0;
        let isGranted = false;
        let animationFrame;

        // 核心动画循环：每帧增加进度
        function updateProgress() {
            if (isGranted) return;
            progress += 1; // 进度增速
            
            // UI 更新
            btn.style.borderColor = '#ff003c';
            btn.style.color = '#fff';
            text.innerText = `SCANNING... ${Math.min(progress, 100)}%`;
            laser.style.opacity = 1;
            
            fill.style.width = `${progress}%`;
            laser.style.left = `${progress}%`;

            if (progress >= 100) {
                // 解锁成功！
                isGranted = true;
                btn.classList.add('granted');
                text.innerText = 'ACCESS GRANTED';
                cancelAnimationFrame(animationFrame);
                return;
            }
            animationFrame = requestAnimationFrame(updateProgress);
        }

        function startPress() {
            if (isGranted) return;
            progress = 0;
            updateProgress();
        }

        function cancelPress() {
            if (isGranted) return;
            cancelAnimationFrame(animationFrame);
            progress = 0;
            // 恢复原状
            fill.style.width = `0%`;
            laser.style.left = `0%`;
            laser.style.opacity = 0;
            btn.style.borderColor = '#444';
            btn.style.color = '#888';
            text.innerText = 'HOLD TO AUTHENTICATE';
        }

        // 绑定鼠标和触屏长按事件
        btn.addEventListener('mousedown', startPress);
        btn.addEventListener('mouseup', cancelPress);
        btn.addEventListener('mouseleave', cancelPress);
        
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); startPress(); });
        btn.addEventListener('touchend', cancelPress);
    </script>
</body>
</html>
